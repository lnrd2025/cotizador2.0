<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotizador de Criptomonedas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- TARJETA PRINCIPAL CONTENEDORA -->
    <main class="main-card">
        
        <!-- Encabezado dentro de la tarjeta -->
        <header class="card-header">
            <div class="title-container">
                <img src="https://assets.coingecko.com/coins/images/1/large/bitcoin.png" alt="Bitcoin" class="header-img">
                <h1>Cotizador de Criptomonedas</h1>
                <img src="https://assets.coingecko.com/coins/images/279/large/ethereum.png" alt="Ethereum" class="header-img">
            </div>
        </header>

        <!-- Cuerpo de 2 columnas dentro de la tarjeta -->
        <div class="card-body">
            
            <!-- Columna Izquierda: Ilustración/Imagen -->
            <div class="hero-image">
                <img src="https://tse3.mm.bing.net/th/id/OIP.wQTWdJf5XW_ca91Zjs6FjgHaE8?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Criptomonedas">
            </div>

            <!-- Columna Derecha: Formulario y Resultados -->
            <div class="cotizador-content">
                <form id="coin-form">
                    <label for="coin">ELIGE TU MONEDA</label>
                    <select id="coin" required>
                        <option value="">Selecciona una moneda</option>
                        <option value="USD">Dólar</option>
                        <option value="VES">Bolívar</option>
                        <option value="EUR">Euro</option>
                    </select>

                    <label for="crypto">ELIGE TU CRIPTOMONEDA</label>
                    <select id="crypto" required>
                        <option value="">Selecciona una criptomoneda</option>
                        <option value="BTC">Bitcoin</option>
                        <option value="ETH">Ethereum</option>
                        <option value="BNB">Binance Coin</option>
                        <option value="SOL">Solana</option>
                    </select>

                    <label for="amount">MONTO A INVERTIR</label>
                    <input type="number" id="amount" placeholder="Ej. 100" step="any" required>

                    <button type="submit">COTIZAR</button>
                </form>

                <!-- Divisor interno -->
                <hr id="result-divider" class="divider" style="display: none;">

                <!-- Resultados dentro de la misma tarjeta -->
                <div id="coin-info" class="info-container" style="display: none;">
                    <p>Precio: <span id="res-price"></span></p>
                    <p>Precio más alto: <span id="res-high"></span></p>
                    <p>Precio más bajo: <span id="res-low"></span></p>
                    <p>Variación 24h: <span id="res-change"></span></p>
                    <p>Puede comprar: <span id="res-crypto-amount" class="highlight"></span></p>
                </div>
            </div>

        </div>

    </main>

    <!-- Pie de página -->
    <footer>
        <p>DATOS PROPORCIONADOS POR BINANCE</p>
        <p class="footer-sub">Desarrollado por <a href="https://github.com/lnrd2025" target="_blank" rel="noopener noreferrer">Leo Pasquale</a></p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
